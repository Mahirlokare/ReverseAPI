[project]
name = "apiscope"
version = "0.1.0"
description = "Hybrid API discovery and reverse-engineering platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "celery>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]\ncapture = ["playwright>=1.48"]\nstatic = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["apiscope", "apiscope.core"]
