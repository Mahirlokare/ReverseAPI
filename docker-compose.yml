services:
  api:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: "1"
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://apiscope:apiscope@postgres:5432/apiscope
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: .
    command: celery -A apiscope.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://apiscope:apiscope@postgres:5432/apiscope
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres,redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apiscope
      POSTGRES_USER: apiscope
      POSTGRES_PASSWORD: apiscope
    volumes: [apiscope_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U apiscope -d apiscope"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [apiscope_redis:/data]
  ui:
    build: ./ui
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on: [api]
volumes:
  apiscope_pg:
  apiscope_redis:
